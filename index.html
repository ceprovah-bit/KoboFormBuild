    <style>
      /* Initial App Loader Styles */
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #f8fafc; /* Corresponds to Tailwind's bg-slate-50 */
        z-index: 9999;
        transition: opacity 0.3s ease-in-out;
        font-family: 'Inter', sans-serif;
      }

      #app-loader svg {
        width: 64px;
        height: 64px;
        color: #0284c7; /* Corresponds to Tailwind's brand-600 */
        animation: pulse 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }

      #app-loader p {
        margin-top: 1rem;
        font-size: 1.125rem; /* text-lg */
        font-weight: 600; /* font-semibold */
        color: #075985; /* Corresponds to Tailwind's brand-800 */
      }
      
      #root:not(:empty) + #app-loader {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.8;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translate3d(0, 40px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out both;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
